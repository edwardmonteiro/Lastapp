name: build-apk

on:
  push:
    branches: [caderno-vivo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar APK (debug)
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: caderno-vivo-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK na branch apk-build
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/caderno-vivo.apk"
          cd "$RUNNER_TEMP/out"
          git init -q -b apk-build
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add caderno-vivo.apk
          git commit -qm "APK de $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-build
